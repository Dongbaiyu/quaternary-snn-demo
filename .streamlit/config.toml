[theme]
base = "light"
primaryColor = "#1d1f23"
backgroundColor = "#f4f5f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#15171a"
font = "sans-serif"

[server]
headless = true
maxUploadSize = 10
enableXsrfProtection = true

[client]
toolbarMode = "viewer"
showErrorDetails = "none"
showErrorLinks = false
showSidebarNavigation = false

[browser]
gatherUsageStats = false
